name: CI 自动构建校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 脚本 / 配置 / 规则 校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell 语法检查
        run: |
          bash -n install.sh
          bash -n test/unit-test.sh
          bash -n scripts/pack-release.sh
          for f in lib/*.sh; do bash -n "$f"; done

      - name: JSON 配置校验
        run: |
          python3 -m json.tool conf/xray-config.template.json > /dev/null
          echo "conf/xray-config.template.json: JSON 合法"
          grep -q '"show": false' conf/xray-config.template.json
          echo "realitySettings.show=false"

      - name: ShellCheck 静态检查 (提示级别, 不阻断)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null 2>&1 || true
          shellcheck -S warning -x install.sh lib/*.sh test/unit-test.sh || true

      - name: 确认已去掉内嵌巨型 JSON (改走 conf/ + 仓库引导)
        run: |
          if grep -q TEMPLATE_JSON_EMBEDDED install.sh; then
            echo "install.sh 不应再内嵌 TEMPLATE_JSON_EMBEDDED"
            exit 1
          fi
          test -d lib && test -f lib/00-common.sh

      - name: v2ray-rules-dat 下载与 sha256 校验
        run: |
          mkdir -p /tmp/rules && cd /tmp/rules
          for f in geoip.dat geosite.dat; do
            curl -fsSL -o "$f" "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$f"
            curl -fsSL -o "$f.sha256sum" "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$f.sha256sum"
            sha256sum -c "$f.sha256sum" --strict
            echo "OK: $f"
          done

      - name: 函数级单元测试 (Docker 容器内)
        run: |
          docker run --rm -v "$PWD:/repo:ro" debian:12 bash -c \
            'apt-get update -qq && apt-get install -y -qq procps curl python3 openssl >/dev/null 2>&1 \
             && bash /repo/test/unit-test.sh'
